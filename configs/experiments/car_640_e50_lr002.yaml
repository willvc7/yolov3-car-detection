# run3: 50 epochs with lr0 lowered for box refinement (single variable vs e50).
exp: car_640_e50_lr002
data: car
hyp_base: hyps/hyp.scratch-high.yaml
hyp_override: {lr0: 0.02}
seed: 42
train: {img: 640, batch: 16, epochs: 50, weights: '', cfg: models/yolov3.yaml,
        cache: ram, project: runs/train}
val:   {img: 640, batch-size: 16, iou: 0.65}
sweep: {iou: [0.5, 0.6, 0.65], conf: [0.15, 0.25, 0.4]}
detect: {img: 640, source: ../datasets/car/images/val, conf: 0.25}